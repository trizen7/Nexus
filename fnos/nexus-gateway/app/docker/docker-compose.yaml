services:
  nexus-gateway:
    image: nexus-gateway-fnos:0.1.5
    pull_policy: never
    container_name: nexus-gateway-fnos
    restart: unless-stopped
    user: "${TRIM_UID}:${TRIM_GID}"
    entrypoint: ["python", "/opt/nexus/fnos_entrypoint.py"]
    command: ["python", "-m", "nexus_gateway", "--host", "0.0.0.0", "--port", "8787"]
    environment:
      NEXUS_GATEWAY_HOST: 0.0.0.0
      NEXUS_GATEWAY_PORT: 8787
      NEXUS_CONFIG_FILE: /data/config.json
      NEXUS_CREDENTIALS_FILE: /data/account.json
      NEXUS_BOOTSTRAP_TOKEN_FILE: /data/bootstrap.token
      NEXUS_MEDIA_DIR: /data/media
      NEXUS_MAX_UPLOAD_BYTES: 52428800
      NEXUS_MAX_TOTAL_STORAGE_BYTES: 10737418240
      NEXUS_MIN_FREE_DISK_BYTES: 536870912
      NEXUS_DEPLOYMENT_MODE: fnos-host
    network_mode: host
    volumes:
      - "${TRIM_PKGVAR}:/data"
      - "${TRIM_APPDEST}/docker/fnos_entrypoint.py:/opt/nexus/fnos_entrypoint.py:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data = json.load(urllib.request.urlopen('http://127.0.0.1:8787/api/setup/status', timeout=3)); raise SystemExit(0 if data.get('initialized') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
