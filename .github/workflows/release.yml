name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on main
        run: git branch -r --contains HEAD | grep -q 'origin/main'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gateway/requirements-dev.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate version and repository history
        run: |
          python scripts/scan_repository_secrets.py
          python scripts/build_release.py --validate-only

      - id: release-metadata
        name: Read validated release metadata
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          gateway_source = Path("gateway/nexus_gateway/__init__.py").read_text(encoding="utf-8")
          gateway_match = re.search(r'__version__\s*=\s*"([^"]+)"', gateway_source)
          if not gateway_match:
              raise SystemExit("could not read Gateway version")
          version = gateway_match.group(1)
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("Git tag does not match Gateway version")

          manifest = Path("fnos/nexus-gateway/manifest").read_text(encoding="utf-8")
          fnos_match = re.search(r"(?m)^version\s*=\s*(\S+)\s*$", manifest)
          if not fnos_match:
              raise SystemExit("could not read fnOS package version")
          fnos_version = fnos_match.group(1)
          if not re.fullmatch(rf"{re.escape(version)}-fnos[1-9][0-9]*", fnos_version):
              raise SystemExit("fnOS package version does not match Gateway version")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"version={version}\n")
              stream.write(f"fnos_version={fnos_version}\n")

      - name: Install Gateway test dependencies
        run: pip install -r gateway/requirements-dev.txt

      - name: Test Gateway Python
        working-directory: gateway
        run: |
          python -m pytest tests -q
          python -m compileall -q nexus_gateway

      - name: Validate Gateway web
        run: |
          node --check gateway/nexus_gateway/web/app.js
          node gateway/tests/web_contract_test.js

      - name: Validate Compose configuration
        run: docker compose config

      - name: Decode Android signing store
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXUS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/nexus-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexus-signing/nexus-release.p12"
          chmod 600 "$RUNNER_TEMP/nexus-signing/nexus-release.p12"

      - name: Test and build signed Android release
        working-directory: android
        env:
          NEXUS_RELEASE_STORE_FILE: ${{ runner.temp }}/nexus-signing/nexus-release.p12
          NEXUS_RELEASE_STORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_STORE_PASSWORD }}
          NEXUS_RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
          NEXUS_RELEASE_KEY_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build architecture-specific native fnOS runtimes
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            docker buildx build \
              --file gateway/FnOS.Dockerfile \
              --platform "linux/$architecture" \
              --output "type=local,dest=$RUNNER_TEMP/nexus-runtime-$architecture" \
              --provenance=false \
              gateway
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish optional Gateway multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: gateway
          file: gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/trizen7/nexus-gateway:${{ steps.release-metadata.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/trizen7/Nexus
            org.opencontainers.image.version=${{ steps.release-metadata.outputs.version }}
            org.opencontainers.image.title=Nexus Gateway
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Download and verify official fnpack
        env:
          FNPACK_SHA256: 54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93
        run: |
          curl --fail --silent --show-error --location \
            "https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64" \
            --output "$RUNNER_TEMP/fnpack"
          echo "$FNPACK_SHA256  $RUNNER_TEMP/fnpack" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/fnpack"

      - name: Build self-contained fnOS packages
        shell: pwsh
        run: |
          ./scripts/build_fnos_package.ps1 -OutputDirectory dist -Platform amd64 -RuntimeDirectoryPath "$env:RUNNER_TEMP/nexus-runtime-amd64" -FnpackPath "$env:RUNNER_TEMP/fnpack"
          ./scripts/build_fnos_package.ps1 -OutputDirectory dist -Platform arm64 -RuntimeDirectoryPath "$env:RUNNER_TEMP/nexus-runtime-arm64" -FnpackPath "$env:RUNNER_TEMP/fnpack"

      - name: Verify self-contained fnOS packages
        env:
          FNOS_VERSION: ${{ steps.release-metadata.outputs.fnos_version }}
        run: |
          python scripts/verify_fnos_package.py "dist/Nexus-fnOS-$FNOS_VERSION-amd64.fpk" --sha256-file dist/SHA256SUMS.txt
          python scripts/verify_fnos_package.py "dist/Nexus-fnOS-$FNOS_VERSION-arm64.fpk" --sha256-file dist/SHA256SUMS.txt

      - name: Package and verify complete release artifacts
        run: |
          python scripts/build_release.py \
            --output dist \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --require-android \
            --require-fnos \
            --verify-signatures

      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-${{ github.ref_name }}
          path: |
            dist/Nexus-Android-${{ steps.release-metadata.outputs.version }}-release.apk
            dist/Nexus-Gateway-${{ steps.release-metadata.outputs.version }}.zip
            dist/Nexus-fnOS-${{ steps.release-metadata.outputs.fnos_version }}-amd64.fpk
            dist/Nexus-fnOS-${{ steps.release-metadata.outputs.fnos_version }}-arm64.fpk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release-metadata.outputs.version }}
          FNOS_VERSION: ${{ steps.release-metadata.outputs.fnos_version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Nexus-Android-$VERSION-release.apk" \
            "dist/Nexus-Gateway-$VERSION.zip" \
            "dist/Nexus-fnOS-$FNOS_VERSION-amd64.fpk" \
            "dist/Nexus-fnOS-$FNOS_VERSION-arm64.fpk" \
            "dist/SHA256SUMS.txt" \
            --verify-tag \
            --title "Nexus $GITHUB_REF_NAME" \
            --notes ""
