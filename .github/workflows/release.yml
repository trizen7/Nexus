name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on main
        run: git branch -r --contains HEAD | grep -q 'origin/main'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gateway/requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate version and repository history
        run: |
          python scripts/scan_repository_secrets.py
          python scripts/build_release.py --validate-only

      - name: Install Gateway test dependencies
        run: pip install -r gateway/requirements-dev.txt

      - name: Test Gateway Python
        working-directory: gateway
        run: |
          python -m pytest tests -q
          python -m compileall -q nexus_gateway

      - name: Validate Gateway web
        run: |
          node --check gateway/nexus_gateway/web/app.js
          node gateway/tests/web_contract_test.js

      - name: Validate Gateway Docker image
        run: docker build -t nexus-mobile-gateway:release gateway

      - name: Validate Compose configuration
        run: docker compose config

      - name: Decode Android signing store
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXUS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/nexus-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexus-signing/nexus-release.p12"
          chmod 600 "$RUNNER_TEMP/nexus-signing/nexus-release.p12"

      - name: Test and build signed Android release
        working-directory: android
        env:
          NEXUS_RELEASE_STORE_FILE: ${{ runner.temp }}/nexus-signing/nexus-release.p12
          NEXUS_RELEASE_STORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_STORE_PASSWORD }}
          NEXUS_RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
          NEXUS_RELEASE_KEY_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease bundleRelease --no-daemon

      - name: Package and verify release artifacts
        run: |
          python scripts/build_release.py \
            --output dist \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --require-android \
            --verify-signatures

      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Nexus $GITHUB_REF_NAME" --generate-notes
