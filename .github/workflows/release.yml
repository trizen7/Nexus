name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on main
        run: git branch -r --contains HEAD | grep -q 'origin/main'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gateway/requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate version and repository history
        run: |
          python scripts/scan_repository_secrets.py
          python scripts/build_release.py --validate-only

      - id: gateway-version
        name: Read validated Gateway version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          source = Path("gateway/nexus_gateway/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', source)
          if not match:
              raise SystemExit("could not read Gateway version")
          version = match.group(1)
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("Git tag does not match Gateway version")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"version={version}\n")

      - name: Install Gateway test dependencies
        run: pip install -r gateway/requirements-dev.txt

      - name: Test Gateway Python
        working-directory: gateway
        run: |
          python -m pytest tests -q
          python -m compileall -q nexus_gateway

      - name: Validate Gateway web
        run: |
          node --check gateway/nexus_gateway/web/app.js
          node gateway/tests/web_contract_test.js

      - name: Validate Compose configuration
        run: docker compose config

      - name: Decode Android signing store
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXUS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/nexus-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexus-signing/nexus-release.p12"
          chmod 600 "$RUNNER_TEMP/nexus-signing/nexus-release.p12"

      - name: Test and build signed Android release
        working-directory: android
        env:
          NEXUS_RELEASE_STORE_FILE: ${{ runner.temp }}/nexus-signing/nexus-release.p12
          NEXUS_RELEASE_STORE_PASSWORD: ${{ secrets.NEXUS_RELEASE_STORE_PASSWORD }}
          NEXUS_RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_RELEASE_KEY_ALIAS }}
          NEXUS_RELEASE_KEY_PASSWORD: ${{ secrets.NEXUS_RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon

      - name: Package and verify release artifacts
        run: |
          python scripts/build_release.py \
            --output dist \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --require-android \
            --verify-signatures

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Gateway multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: gateway
          file: gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/trizen7/nexus-gateway:${{ steps.gateway-version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/trizen7/Nexus
            org.opencontainers.image.version=${{ steps.gateway-version.outputs.version }}
            org.opencontainers.image.title=Nexus Gateway
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Download and verify official fnpack
        env:
          FNPACK_SHA256: 54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93
        run: |
          curl --fail --silent --show-error --location \
            "https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64" \
            --output "$RUNNER_TEMP/fnpack"
          echo "$FNPACK_SHA256  $RUNNER_TEMP/fnpack" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/fnpack"

      - name: Build fnOS package
        shell: pwsh
        run: ./scripts/build_fnos_package.ps1 -OutputDirectory dist -FnpackPath "$env:RUNNER_TEMP/fnpack"

      - name: Verify fnOS package contents
        run: python scripts/verify_fnos_package.py dist/Nexus-fnOS-*.fpk

      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Nexus $GITHUB_REF_NAME"
