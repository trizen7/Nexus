name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gateway/requirements-dev.txt
      - run: pip install -r gateway/requirements-dev.txt
      - run: python -m pytest gateway/tests -q
      - name: Validate Docker image
        run: docker build -t nexus-mobile-gateway:ci gateway
      - name: Validate Compose configuration
        run: |
          cp gateway/.env.example gateway/.env
          docker compose config
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node gateway/tests/web_contract_test.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
