name: Bug 报告
description: 报告可复现的客户端或移动网关问题
title: "[Bug] "
labels: [bug, needs-triage]
body:
  - type: checkboxes
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，未发现重复问题
          required: true
        - label: 我已删除密码、Token、私人会话、服务器路径和用户文件
          required: true
  - type: input
    attributes:
      label: 版本
      placeholder: 例如 Android 0.0.20 / gateway 0.0.1
    validations:
      required: true
  - type: input
    attributes:
      label: 环境
      placeholder: 设备、Android 版本、网关系统与 Python 版本
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      placeholder: 1. ... 2. ... 3. ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    attributes:
      label: 脱敏日志或截图
      description: 不要上传凭据、私人会话或用户文件
