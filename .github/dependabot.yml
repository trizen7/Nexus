version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      android-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gateway-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
