services:
  nexus-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: nexus-mobile-gateway:0.0.6
    container_name: nexus-gateway
    restart: unless-stopped
    environment:
      NEXUS_GATEWAY_HOST: 0.0.0.0
      NEXUS_GATEWAY_PORT: 8787
      NEXUS_TLS_DIR: /data/tls
      NEXUS_TLS_HOSTS: ${NEXUS_TLS_HOSTS:-}
      NEXUS_CONFIG_FILE: /data/config.json
      NEXUS_CREDENTIALS_FILE: /data/account.json
      NEXUS_BOOTSTRAP_TOKEN_FILE: /data/bootstrap.token
      NEXUS_MEDIA_DIR: /data/media
      NEXUS_MAX_UPLOAD_BYTES: 52428800
      NEXUS_MAX_TOTAL_STORAGE_BYTES: 10737418240
      NEXUS_MIN_FREE_DISK_BYTES: 536870912
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8787/health', context=ssl._create_unverified_context(), timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
